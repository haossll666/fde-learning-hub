<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>FDE Flight Simulator | 前线部署工程师全栈学习中心</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="专为企业级大模型落地打造的 FDE 完整知识体系、交付战役方法论、硬核工程代码与沙盒演练平台。">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FDE Hub">
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="format-detection" content="telephone=no">
</head>
<body>
    <div class="app-container">
        <!-- 移动端侧边栏背景遮罩 -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

        <!-- macOS / iPadOS 风格侧边栏 -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="课程目录树">
            <div class="sidebar-header">
                <!-- macOS 交通灯三色圆点 -->
                <div class="traffic-lights">
                    <div class="traffic-light red" id="traffic-light-red" title="关闭侧边栏"></div>
                    <div class="traffic-light yellow"></div>
                    <div class="traffic-light green"></div>
                </div>

                <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="关闭侧边栏" title="关闭目录">✕</button>

                <div class="brand-logo">
                    <span class="brand-title">
                        <span>⚡ FDE Flight Simulator</span>
                    </span>
                    <span class="brand-badge">v3.0</span>
                </div>

                <!-- 学习进度胶囊 -->
                <div class="progress-widget">
                    <div class="progress-info">
                        <span>全栈进度</span>
                        <span id="progress-text">-- / -- 节</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-bar-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Spotlight 极简检索框 -->
            <div class="search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" class="search-input" placeholder="聚焦搜索：知识、代码、黑话..." aria-label="侧边栏章节快速过滤">
                </div>
            </div>

            <!-- 树状章节列表 -->
            <nav class="sidebar-nav" id="sidebar-nav" aria-label="课程章节导航">
                <!-- 动态由 app.js 渲染 -->
            </nav>

            <!-- 底部工具条 -->
            <div class="sidebar-footer">
                <button class="theme-toggle-btn" id="theme-toggle">☀️ 明亮模式</button>
                <a href="https://github.com/haossll666/fde-learning-hub" target="_blank" style="font-size: 0.76rem; color: var(--text-tertiary); text-decoration: none; display: flex; align-items: center; gap: 0.2rem;">GitHub ↗</a>
            </div>
        </aside>

        <!-- 主内容视口 -->
        <main class="main-wrapper" role="main">
            <!-- 毛玻璃顶部状态条 -->
            <header class="top-bar" role="banner">
                <div class="top-bar-left">
                    <button class="menu-toggle-btn" id="menu-toggle" aria-label="Toggle Navigation">☰</button>
                    <div class="breadcrumb-trail" id="breadcrumb-trail">
                        模块〇 &nbsp;›&nbsp; <strong>加载中...</strong>
                    </div>
                </div>
                <div class="top-bar-right">
                    <button class="spotlight-nav-badge" id="spotlight-trigger-btn" onclick="openSpotlight()" aria-label="打开 Spotlight 快速搜索" title="快速搜索 (⌘K / Ctrl+K)">
                        <span class="spotlight-nav-icon">🔍</span>
                        <span class="spotlight-nav-text">搜索...</span>
                        <kbd class="spotlight-nav-kbd">⌘K</kbd>
                    </button>
                    <div class="top-bar-subtitle">
                        Cupertino Precision Design
                    </div>
                </div>
            </header>

            <div class="content-container">
                <!-- 章节标题与已学按钮挂载点 -->
                <div class="section-header-block" id="section-header-mount">
                    <!-- 动态渲染 -->
                </div>

                <!-- 核心文章正文区 -->
                <article class="prose" id="section-content-mount">
                    <!-- 动态渲染正文、图表、代码、测验与计算器 -->
                </article>
            </div>
        </main>
    </div>

    <!-- Spotlight 快速搜索全局遮罩模态框 (Apple Cupertino 物理景深与毛玻璃质感) -->
    <div id="spotlight-overlay" class="spotlight-overlay hidden" role="dialog" aria-modal="true" aria-label="Spotlight 快速搜索" onclick="closeSpotlight()">
        <div class="spotlight-modal" onclick="event.stopPropagation()">
            <div class="spotlight-header">
                <span class="spotlight-search-glyph">🔍</span>
                <input type="text" id="spotlight-input" class="spotlight-input" placeholder="全局搜索：知识点、工程代码、行业黑话、权威文献..." autocomplete="off" spellcheck="false" aria-label="搜索框">
                <button class="spotlight-esc-pill" onclick="closeSpotlight()" aria-label="关闭搜索">ESC</button>
            </div>
            <div class="spotlight-results" id="spotlight-results" role="listbox" aria-label="搜索结果">
                <!-- 动态由 app.js 渲染 -->
            </div>
            <div class="spotlight-footer">
                <div class="spotlight-hints">
                    <span class="spotlight-hint"><kbd class="spotlight-kbd">↑</kbd> <kbd class="spotlight-kbd">↓</kbd> 切换选项</span>
                    <span class="spotlight-hint"><kbd class="spotlight-kbd">↵</kbd> 跳转正文</span>
                    <span class="spotlight-hint"><kbd class="spotlight-kbd">ESC</kbd> 退出</span>
                </div>
                <div class="spotlight-brand">
                    <span>⚡ FDE Flight Simulator</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 全局胶囊轻提示 (Cupertino Capsule Toast) -->
    <div id="capsule-toast" class="capsule-toast hidden" role="status" aria-live="polite"></div>

    <!-- 移动端回到顶部悬浮按钮 -->
    <button id="back-to-top-btn" class="back-to-top-btn hidden" onclick="scrollToTop()" aria-label="回到顶部" title="回到顶部">↑</button>

    <!-- 数据与逻辑驱动脚本 -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
